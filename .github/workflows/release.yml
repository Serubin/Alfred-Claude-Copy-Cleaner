name: Release

# A v1.2.3 tag runs CI (ci.yml), then attaches the .alfredworkflow to a draft release.
# workflow_dispatch is a dry run: it uploads a run artifact instead of drafting.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A re-pushed tag must not race its own earlier run.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the draft release and upload assets

    steps:
      - name: Check out
        # Pinned to a commit rather than a tag: a tag can be moved.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Install build dependencies
        # zip/unzip are used by build.sh; installed defensively in case the runner
        # image ever drops them.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zip unzip

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          declared="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            if [ "$version" != "$declared" ]; then
              echo "::error::Tag $tag implies version $version but VERSION says $declared." \
                   "Bump VERSION in the commit you tag, or retag."
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            tag=""
            version="$declared"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dry run — building $version without publishing."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package workflow
        id: artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          asset="$(tools/package.sh "$VERSION" | tail -n 1)"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload dry-run artifact
        if: steps.version.outputs.publish != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alfredworkflow-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

      - name: Create or update draft release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET: ${{ steps.artifact.outputs.asset }}
        run: |
          set -euo pipefail
          # The tags/ endpoint skips drafts, so search the full list.
          matches="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.tag_name == env.TAG) | {draft, html_url} | @json')"
          count="$(printf '%s' "$matches" | grep -c . || true)"

          if [ "$count" -eq 0 ]; then
            # --generate-notes works out the previous tag on its own.
            url="$(gh release create "$TAG" --draft --verify-tag \
              --title "$TAG" \
              --generate-notes \
              "$ASSET" "$ASSET.sha256")"
          elif [ "$count" -gt 1 ]; then
            echo "::error::$count releases exist for $TAG; delete the stale drafts and re-run."
            exit 1
          elif [ "$(jq -r .draft <<< "$matches")" = "true" ]; then
            gh release upload "$TAG" --clobber "$ASSET" "$ASSET.sha256"
            url="$(jq -r .html_url <<< "$matches")"
          else
            echo "::error::$TAG is already published; refusing to replace its assets."
            exit 1
          fi
          echo "::notice::Draft release for $TAG is ready to review: $url"
